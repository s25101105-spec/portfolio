<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業與專案目錄</title>
    <style>
        /* 基礎重設與字型設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 主容器排版 */
        #app {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        /* 頂部標題（可選，這邊幫你預留一個網頁大標題的感覺） */
        #app::before {
            content: "作品集";
            display: block;
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 15px;
        }

        /* 區塊（ex06, ex07）卡片化 */
        section {
            margin-bottom: 30px;
            background: #fafbfc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        section:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.05);
        }

        /* 區塊標題 */
        h2 {
            font-size: 1.4rem;
            color: #34495e;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }
        h2::before {
            content: "📁";
            margin-right: 8px;
            font-size: 1.2rem;
        }

        /* 列表排版（改為網格或彈性佈局，不再是死板的清單） */
        ul {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        /* 超連結按鈕化 */
        li a {
            display: block;
            text-decoration: none;
            color: #4a5568;
            background: #ffffff;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            text-align: center;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease-in-out;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 超連結滑鼠懸停特效 */
        li a:hover {
            color: #ffffff;
            background: #3182ce;
            border-color: #3182ce;
            box-shadow: 0 4px 6px rgba(49, 130, 206, 0.2);
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <main id="app">
        <section>
            <h2>ex06</h2>
            <ul>
                <li><a href="./ex06/index.html">index.html</a></li>
                <li><a href="./ex06/bistro.html">bistro.html</a></li>
                <li><a href="./ex06/jenware.html">jenware.html</a></li>
            </ul>
        </section>
        
        <section>
            <h2>ex07</h2>
            <ul>
                <li><a href="./ex07/01_image_ex/image.html">01_image_ex</a></li>
                <li><a href="./ex07/jenware.html">jenware.html</a></li>
                <li><a href="./ex07/menu.html">menu.html</a></li>
            </ul>
        </section>
    </main>
    <script src="./assets/main.js"></script>
</body>
</html>
