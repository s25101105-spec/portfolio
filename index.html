<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業與專案目錄</title>
    <style>
        /* 基礎重設與字型設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            /* 背景：改用現代科技感的暗色至亮色大範圍漸層 */
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 主容器排版 */
        #app {
            width: 100%;
            max-width: 800px;
            /* 讓主容器帶有微微的半透明與白至灰漸層，增加懸浮層次感 */
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(245, 247, 250, 0.95) 100%);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(10px);
        }

        /* 頂部標題：炫彩漸層字體 */
        #app::before {
            content: "作品集";
            display: block;
            font-size: 2.4rem;
            font-weight: 800;
            /* 標題漸層：經典藍紫極光色 */
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 35px;
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }

        /* 區塊（ex06, ex07）卡片化 */
        section {
            margin-bottom: 30px;
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }
        
        /* 區塊 1 的左側漸層條 */
        section:nth-of-type(1) {
            border-left: 6px solid #4f46e5;
        }
        /* 區塊 2 的左側漸層條（換個多層次的青綠至深藍漸層） */
        section:nth-of-type(2) {
            border-left: 6px solid #06b6d4;
        }

        section:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.06);
        }

        /* 區塊標題：配合左側邊框的極簡幾何方塊 */
        h2 {
            font-size: 1.3rem;
            color: #1e293b;
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
        }
        h2::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 18px;
            border-radius: 4px;
            margin-right: 10px;
        }
        /* 給小方塊個別對應的漸層色 */
        section:nth-of-type(1) h2::before {
            background: linear-gradient(to bottom, #4f46e5, #7c3aed);
        }
        section:nth-of-type(2) h2::before {
            background: linear-gradient(to bottom, #06b6d4, #0284c7);
        }

        /* 列表排版 */
        ul {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
        }

        /* 超連結按鈕化 */
        li a {
            display: block;
            text-decoration: none;
            color: #475569;
            /* 預態也是極淡的柔和漸層 */
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 區塊 1 按鈕滑鼠懸停：深邃藍紫漸層 */
        section:nth-of-type(1) li a:hover {
            color: #ffffff;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
            transform: translateY(-2px);
        }

        /* 區塊 2 按鈕滑鼠懸停：明亮青藍漸層 */
        section:nth-of-type(2) li a:hover {
            color: #ffffff;
            background: linear-gradient(135deg, #06b6d4 0%, #0284c7 100%);
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.35);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <main id="app">
        <section>
            <h2>ex06</h2>
            <ul>
                <li><a href="./ex06/index.html">index.html</a></li>
                <li><a href="./ex06/bistro.html">bistro.html</a></li>
                <li><a href="./ex06/jenware.html">jenware.html</a></li>
            </ul>
        </section>
        
        <section>
            <h2>ex07</h2>
            <ul>
                <li><a href="./ex07/01_image_ex/image.html">01_image_ex</a></li>
                <li><a href="./ex07/jenware.html">jenware.html</a></li>
                <li><a href="./ex07/menu.html">menu.html</a></li>
            </ul>
        </section>
    </main>
    <script src="./assets/main.js"></script>
</body>
</html>
